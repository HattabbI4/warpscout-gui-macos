name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Register a separate Cloudflare WARP device and run live endpoint checks
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        env:
          WARPSCOUT_LIVE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.live && matrix.runner == 'macos-26' && '1' || '0' }}
        run: ./scripts/test.sh
      - name: Test release scripts
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
